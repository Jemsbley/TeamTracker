# Local-dev convenience: spin up Postgres without installing it system-wide.
# Run with: docker compose up -d
# Then in another terminal: npm run prisma:migrate && npm run dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamtracker
    ports:
      - "5432:5432"
    volumes:
      - teamtracker-pg:/var/lib/postgresql/data

volumes:
  teamtracker-pg:
